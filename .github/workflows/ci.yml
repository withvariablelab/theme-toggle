name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    branches:
      - main

permissions:
  contents: read # checkout

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version

      - name: ⌛ Setup pnpm
        # First-party action, deliberately tracked at @main.
        uses: withvariablelab/gh-actions/actions/setup-pnpm@main # zizmor: ignore[unpinned-uses]

      - name: 💅 Check
        run: pnpm rr check

      - name: 🎭 Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: 🧪 Test
        run: pnpm test

      - name: 🔨 Build
        run: pnpm rr pack

  zizmor:
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # Audits .github/ (the repo has no other workflows or actions). Passing the
      # repo root keeps the annotation paths repo-relative so they land on the diff.
      - name: 🌈 Audit workflows (zizmor)
        env:
          # Read-only token so zizmor also runs its online audits
          # (known-vulnerable-actions, impostor-commit, ref-confusion).
          GH_TOKEN: ${{ github.token }}
        run: pipx run --spec zizmor==1.30.1 zizmor --format=github .
