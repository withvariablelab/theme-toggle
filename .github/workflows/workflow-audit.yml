# Static security analysis of the GitHub Actions workflows (zizmor).
# Config and reviewed exceptions: .github/zizmor.yml

name: Workflow audit

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    branches:
      - main

permissions:
  contents: read # checkout

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit-workflows:
    name: Audit workflows
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # Audits .github/ (the repo has no other workflows or actions). Passing the
      # repo root keeps the annotation paths repo-relative so they land on the diff.
      - name: 🔒 Scan workflows
        env:
          # Read-only token so zizmor also runs its online audits
          # (known-vulnerable-actions, impostor-commit, ref-confusion).
          GH_TOKEN: ${{ github.token }}
        run: pipx run --spec zizmor==1.30.1 zizmor --format=github .
