# On push to main: opens the version PR, or publishes to npm once it is merged.
# On pull requests from feat*/fix* branches or labeled "preview": publishes a
# preview build of the PR to npm and comments how to install it.

name: Release

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    branches:
      - main

# The org default GITHUB_TOKEN is read-only; each job asks for exactly what it needs.
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Release or open version PR
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    # The version commit, the version PR, the tags and the GitHub releases are
    # created through the GitHub API with the vland-bot token minted below, not
    # GITHUB_TOKEN.
    permissions:
      id-token: write # npm trusted publishing (OIDC)
      contents: read # checkout
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Nothing here pushes with git: changesets/action commits and tags
          # through the GitHub API.
          persist-credentials: false

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version

      - name: ⌛ Setup pnpm and install dependencies
        # First-party action, deliberately tracked at @main.
        uses: withvariablelab/gh-actions/actions/setup-pnpm@main

      - name: 🔑 Mint vland-bot token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.VLAND_BOT_CLIENT_ID }}
          private-key: ${{ secrets.VLAND_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      # `changeset version` commits locally because .changeset/config.json sets
      # `commit: true`, and git needs an identity for that. The local commit
      # never leaves the runner: changesets/action recreates it through the API.
      - name: 🧑‍💻 Configure git user as vland-bot
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          user_id="$(gh api "/users/${APP_SLUG}[bot]" --jq .id)"
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${user_id}+${APP_SLUG}[bot]@users.noreply.github.com"

      - name: 🚀 Open version PR or publish to npm
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          # With the bot token, GitHub signs the version commit and attributes
          # it to vland-bot, so CI runs on the version PR.
          github-token: ${{ steps.app-token.outputs.token }}
          commit-message: "chore: update versions"
          pr-title: "chore: update versions"
          publish-script: pnpm changeset publish
        env:
          # No git hooks on the local commit made by `changeset version`.
          LEFTHOOK: 0

  # Runs the PR's code and publishes the preview to npm via OIDC. It never sees
  # the vland-bot key; it only hands the published package list to the next job.
  preview:
    name: Publish PR preview
    if: ${{ github.event_name == 'pull_request' && (startsWith(github.head_ref, 'feat') || startsWith(github.head_ref, 'fix') || contains(github.event.pull_request.labels.*.name, 'preview')) }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write # npm trusted publishing (OIDC)
      contents: read # checkout
    outputs:
      packages: ${{ steps.preview.outputs.packages }}
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version

      - name: ⌛ Setup pnpm and install dependencies
        # First-party action, deliberately tracked at @main.
        uses: withvariablelab/gh-actions/actions/setup-pnpm@main

      - name: 🚀 Publish PR preview to npm
        id: preview
        # First-party action, deliberately tracked at @main.
        uses: withvariablelab/gh-actions/actions/preview-release@main
        with:
          mode: publish
          # Keep this explicit while the repo has a project .npmrc: preview-release
          # auto-detects any .npmrc as token-only, and there is no NPM_TOKEN here.
          publish_mode: oidc-only

  # Never checks out or runs PR code: the reusable workflow mints the vland-bot
  # token (pull-requests: write, this repo only) and upserts the PR comment.
  preview-comment:
    name: Comment PR preview
    needs: preview
    if: ${{ needs.preview.result == 'success' }}
    permissions: {}
    # First-party reusable workflow, deliberately tracked at @main.
    uses: withvariablelab/gh-actions/.github/workflows/preview-comment.yml@main
    with:
      action: preview-release
      packages: ${{ needs.preview.outputs.packages }}
    secrets:
      VLAND_BOT_PRIVATE_KEY: ${{ secrets.VLAND_BOT_PRIVATE_KEY }}
